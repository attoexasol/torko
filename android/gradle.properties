# Low memory: 512m heap, 256m metaspace (128m caused Metaspace OOM during Android build).
# UseSerialGC avoids G1 virtual-space OOM. If "Could not reserve" returns, lower MaxMetaspaceSize to 192m.
# With 8GB+ RAM: org.gradle.daemon=true, -Xmx2G -XX:MaxMetaspaceSize=512m, remove UseSerialGC.
org.gradle.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=256m -XX:ReservedCodeCacheSize=64m -XX:+UseSerialGC
org.gradle.daemon=false
android.useAndroidX=true
